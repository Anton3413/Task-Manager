<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>My Tasks | Task Manager</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="/css/tasks.css" rel="stylesheet">
    <link href="/css/main.css" rel="stylesheet">
</head>

<body>
<div th:replace="~{fragments/header :: main-header}"></div>

<main class="main-content">
    <div class="container mt-4 mb-5">
        <div class="row justify-content-center">
            <div class="col-12 col-md-10 col-lg-8">

                <div class="text-center mb-3">
                    <h5 id="local-date"></h5>
                    <h6 id="local-time"></h6>
                </div>

                <div class="d-flex justify-content-between align-items-center mb-3">
                    <h1 class="display-6 mb-0">My Tasks</h1>
                    <a class="btn btn-cyan-custom px-4 shadow-sm" th:href="@{/tasks/new}">New Task</a>
                </div>

                <table class="table table-striped table-rounded border shadow-sm main-tasks-table">
                    <thead class="table-custom-navy">
                    <tr>
                        <th style="width:8%;">
                            <a class="sort-link"
                               th:href="@{/tasks(sortField='id', sortDir=${sortField == 'id' ? reverseSortDir : 'asc'})}">
                                № <i th:class="${sortDir == 'asc' ? 'bi bi-caret-up-fill' : 'bi bi-caret-down-fill'}"
                                     th:if="${sortField == 'id'}"></i>
                            </a>
                        </th>
                        <th style="width:42%;">
                            <a class="sort-link"
                               th:href="@{/tasks(sortField='title', sortDir=${sortField == 'title' ? reverseSortDir : 'asc'})}">
                                Title <i th:class="${sortDir == 'asc' ? 'bi bi-caret-up-fill' : 'bi bi-caret-down-fill'}"
                                         th:if="${sortField == 'title'}"></i>
                            </a>
                        </th>
                        <th style="width:20%;">
                            <a class="sort-link"
                               th:href="@{/tasks(sortField='dueDate', sortDir=${sortField == 'dueDate' ? reverseSortDir : 'asc'})}">
                                Due Date <i th:class="${sortDir == 'asc' ? 'bi bi-caret-up-fill' : 'bi bi-caret-down-fill'}"
                                            th:if="${sortField == 'dueDate'}"></i>
                            </a>
                        </th>
                        <th style="width:20%;">
                            <a class="sort-link"
                               th:href="@{/tasks(sortField='status', sortDir=${sortField == 'status' ? reverseSortDir : 'asc'})}">
                                Status <i th:class="${sortDir == 'asc' ? 'bi bi-caret-up-fill' : 'bi bi-caret-down-fill'}"
                                          th:if="${sortField == 'status'}"></i>
                            </a>
                        </th>
                        <th class="text-center" style="width:10%;">
                            <span class="actions-header">Actions</span>
                        </th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="task, iterStat : ${tasks}">
                        <td style="cursor:pointer;"
                            th:onclick="|window.location='@{/tasks/{id}(id=${task.id})}'|"
                            th:text="${iterStat.count}"></td>

                        <td class="fw-medium"
                            style="cursor:pointer;" th:onclick="|window.location='@{/tasks/{id}(id=${task.id})}'|">
                            <div class="text-truncate-container" th:text="${task.title}" th:title="${task.title}"></div>
                        </td>

                        <td style="cursor:pointer;"
                            th:onclick="|window.location='@{/tasks/{id}(id=${task.id})}'|"
                            th:text="${#temporals.format(task.dueDate, 'dd.MM.yyyy HH:mm')}"></td>
                        <td>
                            <form method="post" th:action="@{/tasks/updateStatus}">
                                <input th:name="taskId" th:value="${task.id}" type="hidden"/>
                                <select class="form-select form-select-sm task-status-select" name="status"
                                        onchange="this.form.submit()">
                                    <option th:each="s : ${statuses}"
                                            th:selected="${s == task.status}"
                                            th:text="${s}"
                                            th:value="${s}">
                                    </option>
                                </select>
                            </form>
                        </td>
                        <td class="text-center">
                            <div class="d-inline-flex align-items-center gap-3">
                                <a class="text-primary action-icon"
                                   th:href="@{/tasks/edit/{id}(id=${task.id})}"
                                   title="Edit">
                                    <i class="bi bi-pencil-square"></i>
                                </a>
                                <form class="m-0"
                                      method="post"
                                      th:action="@{/tasks/delete/{id}(id=${task.id})}">
                                    <button class="btn btn-link p-0 text-danger action-icon"
                                            title="Delete"
                                            type="submit">
                                        <i class="bi bi-trash"></i>
                                    </button>
                                </form>
                            </div>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</main>

<div th:replace="~{fragments/footer :: main-footer}"></div>
</body>
</html>
